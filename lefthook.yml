# https://lefthook.dev — git hooks manager
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{js,jsx,ts,tsx}'
      run: bunx eslint {staged_files} --fix --no-warn-ignored
      stage_fixed: true
    - name: format
      glob: '*.{js,jsx,ts,tsx,json,md,css}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: bun run typecheck
